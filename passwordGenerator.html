<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <h1>password generator</h1>
        <label>password Length :</label>
        <input type="number" id="length" value="10" min="1" max="10">
        <br>
        <label>
            <input type="checkbox" id="numbers" checked>
            Include Numbers
        </label>
        <br>
        <label>
            <input type="checkbox" id="special" checked>
            Include special
        </label>
        <br>
        <button id="generate">Generate Password</button>
        <div id="password">
            Your password will appear here
        </div>
        <button id="copy">Copy</button>
    </div>
<script>
    let lengthInput = document.getElementById("length");
    let isNumbers = document.getElementById("numbers");
    let isSpecial = document.getElementById("special");
    let btn = document.getElementById("generate");
    let password = document.getElementById("password");
    let copy = document.getElementById("copy");

    btn.addEventListener("click", function(){
        copy.innerText = "copy";
        let alpha = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

        let length = Number(lengthInput.value);

        if(isNumbers.checked){
            alpha += "0123456789";
        }

        if(isSpecial.checked){
            alpha += "!@#$%^&*";
        }

        let genPassword = "";

        for(let i=0;i<length;i++){
            let randomIndex = Math.floor(Math.random() * alpha.length);

            genPassword += alpha[randomIndex];
        }

        password.innerText = genPassword;
    })

    copy.addEventListener("click", function(){
        navigator.clipboard.writeText(password.textContent);
        copy.innerText = "copied!";
    })

</script>

</body>
</html>
